server {
    listen 80 default_server;
    root /var/www/html;
    index index.php index.html;

    access_log off;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60;
    }
}
