; Pool di prova: pochi worker che non vengono mai riciclati.
;
; pm.max_requests = 0 e' il punto: se l'estensione perde memoria a ogni
; richiesta, con il riciclo attivo non si vedrebbe mai, perche' php-fpm
; ammazzerebbe il worker prima che il problema diventi visibile.
[prova]
user = www-data
group = www-data
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = static
pm.max_children = 4
pm.max_requests = 0

catch_workers_output = yes
