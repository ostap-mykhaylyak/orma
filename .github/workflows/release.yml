name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: artefatti (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Immagine di build
        run: docker build -t orma-build build

      - name: Estensione
        run: |
          docker run --rm -v "$PWD":/src orma-build sh /src/build/compile.sh
          docker run --rm -v "$PWD":/src -w /src/ext orma-build sh -c '
            NO_INTERACTION=1 REPORT_EXIT_STATUS=1 make test
          '

      - name: Artefatti
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # php8.5-fpm su Ubuntu e' NTS: si pubblica solo la variante NTS.
          cp ext/modules/orma.so "dist/orma-${version}-php8.5-nts-${{ matrix.arch }}.so"

          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags "-X github.com/ostap-mykhaylyak/orma/internal/version.Version=${version} -X github.com/ostap-mykhaylyak/orma/internal/version.Commit=${GITHUB_SHA:0:7}" \
            -o "dist/orma-${version}-linux-${{ matrix.arch }}" ./cmd/orma

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Note di rilascio
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > /tmp/note.md <<NOTE
          APM per PHP self-hosted, indipendente dal framework: si aggancia al motore
          Zend e dice dove se ne va il tempo di una richiesta.

          **Richiede PHP 8.5 su Ubuntu 26.04**, amd64 o arm64. Una sola ABI, quindi
          due artefatti invece di sedici.

          ## Installazione

          \`\`\`bash
          sudo install -m 0755 orma-${version}-linux-amd64 /usr/local/bin/orma
          cp orma-${version}-php8.5-nts-amd64.so ./orma.so
          sudo orma --init
          sudo phpenmod orma && sudo systemctl restart php8.5-fpm
          sudo orma start
          \`\`\`

          \`--init\` installa l'estensione, **verifica che PHP la carichi davvero**,
          installa il servizio systemd e genera il token di accesso al pannello. Se
          l'artefatto non corrisponde alla build di PHP presente, viene rimosso e te lo
          dice.

          ## Aggiornamento da una versione precedente

          **Estensione e daemon vanno sostituiti insieme.** Il protocollo fra i due ha
          una versione: un daemon nuovo rifiuta i frame di un'estensione vecchia con un
          messaggio chiaro invece di interpretarli male, ma nel frattempo non raccoglie
          nulla.

          \`\`\`bash
          sudo systemctl stop orma
          sudo install -m 0755 orma-${version}-linux-amd64 /usr/local/bin/orma
          cp orma-${version}-php8.5-nts-amd64.so ./orma.so
          sudo orma --init --extension ./orma.so   # se la configurazione esiste gia', vedi sotto
          sudo systemctl restart php8.5-fpm
          sudo systemctl start orma
          \`\`\`

          Se \`/etc/orma/orma.yaml\` esiste già, \`--init\` si rifiuta di sovrascriverlo:
          copia a mano il nuovo \`.so\` nella \`extension_dir\` e sostituisci il binario.
          Le tabelle delle metriche vengono ricreate da sole quando lo schema cambia, e
          il daemon lo scrive nel log: **i dati storici si perdono**, quelli di
          telemetria sono rimpiazzabili.

          ## Trovare un rallentamento

          La pagina di un trace si apre con **«Da dove partire»**: le osservazioni
          già fatte, ordinate per tempo recuperabile — quale funzione interna domina,
          quali query si ripetono in un ciclo, quali span trattengono tempo proprio, e
          dove il codice sta aspettando invece di lavorare.

          Il waterfall raccoglie le query identiche in una riga con \`×n\`, si filtra
          per durata, e dichiara se il tetto degli span lo ha troncato.

          ## Cosa costa

          Su WordPress vero, misurato con giro di controllo a estensione spenta:
          **fra il 4% e il 9% di throughput**, nessuna crescita di memoria dei worker
          su 3000 richieste senza riciclo.

          ## Stato

          Provata su WordPress con php-fpm, sotto AddressSanitizer e
          UndefinedBehaviorSanitizer, e con 4000 casi di SQL malformato contro
          l'offuscatore. L'unit systemd è verificata con systemd come PID 1.

          Restano fuori \`curl_multi_exec\` come span, gli artefatti ZTS e il supporto a
          versioni di PHP diverse dalla 8.5. Il daemon gira come root: un utente
          dedicato è il passo successivo.
          NOTE
          echo "note pronte"

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "orma ${GITHUB_REF_NAME}" \
            --notes-file /tmp/note.md \
            --generate-notes
